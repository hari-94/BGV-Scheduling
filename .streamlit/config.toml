[theme]
base = "light"
primaryColor = "#2563a8"
backgroundColor = "#f4f5f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#1f2733"
font = "sans serif"

[client]
showSidebarNavigation = false

[server]
headless = true
enableCORS = false

[runner]
# Disable Streamlit "magic" — the implicit display of bare expressions. The app
# renders everything through explicit st.* calls, so magic is never wanted here.
# With it on, bare statements whose value is None (e.g. list.append(...),
# helper calls) were being auto-rendered as a column of "None" on the page.
magicEnabled = false
