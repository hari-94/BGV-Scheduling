<!doctype html>
<!--
  The Front Desk page's board (pages/14_Front_Desk.py; rows from frontdesk.board
  off the shared floor, floor.py). Python hands over one row per room; this
  page draws everything else and filters as you type -- in the browser, so it
  is instant and costs the app nothing. A late checkout, guest departed or a
  note goes back as {id, action, room, value}; the page saves it and draws the
  board again, and a toast here says whether it took.

  Light and dark (Hari, 21 Nov): the switch is remembered on this device and
  also dresses the page around the board (its menu, its background) through
  data-fd-theme on the page's <html>, which only the Front Desk page styles.
  Motion: tiles count, a room whose status just changed glows, editors slide
  open; none of it with "reduce motion" set on the device.

  It speaks Streamlit's component protocol by hand (componentReady, render,
  setComponentValue, setFrameHeight), like components/report_table, so there
  is nothing to build. On a computer the board fills the window and its table
  scrolls under the search and tiles; on a phone the page scrolls. While an
  editor is open a refresh waits, so it never eats what somebody is typing.
  No apostrophes inside the script's single-quoted strings: write &#39;
  (tests/test_floor.py runs node's syntax check on it where node exists).
-->
<html data-theme="light">
<head>
<meta charset="utf-8">
<style>
:root{
  --bg:#f6f7f9;--card:#ffffff;--card2:#f9fafc;--ink:#16202e;--ink2:#5b6675;--ink3:#8a94a3;
  --line:#e3e7ec;--line2:#eef1f4;--acc:#2563a8;--acc2:#3b82d6;--accbg:#eef4fb;--hl:#fff3a8;
  --shadow:0 1px 2px rgba(16,26,42,.04),0 8px 24px rgba(16,26,42,.06);
  --head:#f3f5f8;--edit:#f7f9fc;--chip-n:#eef1f5;--chip-n-ink:#4a5566;
  --late:#fde7d4;--late-ink:#8a3b05;--dep:#d6f2df;--dep-ink:#14532d;--early:#dbeafe;--early-ink:#12447e;
  --added:#c9eef4;--added-ink:#164e63;--pre:#ede4fb;--pre-ink:#4c1d95;--fd:#e7effa;--fd-ink:#1e3a5f;
  --glow:rgba(59,130,214,.30);--toast:#16202e;--toast-ink:#fff;
}
html[data-theme="dark"]{
  --bg:#0b1119;--card:#121a26;--card2:#0f1722;--ink:#e6edf5;--ink2:#a3afbf;--ink3:#6f7c8e;
  --line:#223044;--line2:#1a2533;--acc:#5b9cf0;--acc2:#7cb3f7;--accbg:#16243a;--hl:#5c4d0b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --head:#151f2d;--edit:#101a27;--chip-n:#1c2736;--chip-n-ink:#b3bfcd;
  --late:#3a2410;--late-ink:#f8b77b;--dep:#12301f;--dep-ink:#86e0a8;--early:#14284a;--early-ink:#9cc3f5;
  --added:#0f3440;--added-ink:#8adbe9;--pre:#2a1f45;--pre-ink:#c9b2f7;--fd:#16263d;--fd-ink:#a9c8f0;
  --glow:rgba(91,156,240,.35);--toast:#e6edf5;--toast-ink:#0b1119;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:transparent;color:var(--ink);
  font-family:'DM Sans',-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;
  -webkit-font-smoothing:antialiased;}
button{font:inherit;}
.tr{transition:background-color .35s ease,border-color .35s ease,color .35s ease,box-shadow .35s ease;}
#root{display:flex;flex-direction:column;gap:9px;padding:2px 2px 8px;}

/* header */
.hero{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.hero h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em;}
.hero .day{color:var(--ink2);font-size:14px;}
.live{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);
  background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;}
.live .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;position:relative;}
.live .dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;background:#22c55e;
  opacity:.45;animation:ping 2s cubic-bezier(0,0,.2,1) infinite;}
.live.stale .dot,.live.stale .dot::after{background:#f59e0b;}
.sp{flex:1;}
.theme{position:relative;width:62px;height:32px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);cursor:pointer;padding:0;}
.theme .knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:linear-gradient(135deg,#fbbf24,#f59e0b);box-shadow:0 2px 6px rgba(0,0,0,.18);
  transition:transform .45s cubic-bezier(.34,1.56,.64,1),background .45s ease;display:grid;place-items:center;}
html[data-theme="dark"] .theme .knob{transform:translateX(30px);background:linear-gradient(135deg,#334155,#0f172a);}
.theme svg{width:14px;height:14px;}
.theme .sun{color:#fff;}
.theme .moon{color:#e2e8f0;display:none;}
html[data-theme="dark"] .theme .sun{display:none;}
html[data-theme="dark"] .theme .moon{display:block;}

/* toolbar */
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.search{flex:1 1 320px;position:relative;}
.search input{width:100%;height:44px;border:1.5px solid var(--line);border-radius:12px;padding:0 40px 0 42px;
  font-size:15px;color:var(--ink);background:var(--card);outline:none;}
.search input::placeholder{color:var(--ink3);}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 4px var(--glow);}
.search .mag{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink3);width:18px;height:18px;pointer-events:none;}
.search .x{position:absolute;right:8px;top:50%;transform:translateY(-50%) scale(.6);opacity:0;border:0;
  background:var(--chip-n);color:var(--ink2);width:26px;height:26px;border-radius:50%;cursor:pointer;
  transition:transform .2s ease,opacity .2s ease;pointer-events:none;}
.search.has .x{opacity:1;transform:translateY(-50%) scale(1);pointer-events:auto;}
.search .kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--ink3);
  border:1px solid var(--line);border-radius:6px;padding:1px 6px;transition:opacity .2s;}
.search.has .kbd{opacity:0;}
.btn{height:44px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);
  font-weight:600;cursor:pointer;white-space:nowrap;transition:transform .15s ease,border-color .2s,background .2s;}
.btn:hover{border-color:var(--acc);background:var(--accbg);transform:translateY(-1px);}
.btn:active{transform:translateY(0) scale(.98);}

/* progress */
.prog{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);}
.prog .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-bottom:8px;}
.prog .top b{color:var(--ink);font-size:15px;}
.stack{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--line2);}
.stack i{display:block;height:100%;transition:width .7s cubic-bezier(.22,1,.36,1);}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--ink2);}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;}
.tile{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:9px 12px;min-width:0;
  cursor:pointer;text-align:left;color:var(--ink);position:relative;overflow:hidden;
  transition:transform .18s ease,box-shadow .2s ease,border-color .2s ease,background-color .35s ease;}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
.tile .n{font-size:23px;font-weight:700;line-height:1.1;display:block;font-variant-numeric:tabular-nums;}
.tile .l{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;}
.tile .d{width:9px;height:9px;border-radius:50%;display:inline-block;}
.tile.on{border-color:var(--acc);background:var(--accbg);box-shadow:0 0 0 4px var(--glow);}
.tile.zero{opacity:.55;}

/* the desk's four cards */
.desk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;}
.dc{position:relative;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:14px;
  padding:7px 12px 7px 15px;cursor:pointer;color:var(--ink);min-width:0;overflow:hidden;box-shadow:var(--shadow);
  transition:transform .18s ease,box-shadow .2s ease,border-color .2s ease,background-color .35s ease;}
.dc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c);}
.dc:hover{transform:translateY(-2px);}
.dc .dl{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dc .n{display:block;font-size:23px;font-weight:700;line-height:1.1;color:var(--c);font-variant-numeric:tabular-nums;}
.dc .bar{display:block;height:5px;border-radius:999px;background:var(--line2);margin:5px 0 4px;overflow:hidden;}
.dc .bar i{display:block;height:100%;background:var(--c);border-radius:999px;transition:width .7s cubic-bezier(.22,1,.36,1);}
.dc.count .bar{visibility:hidden;}
.dc .sub{display:block;font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dc.on{border-color:var(--c);background:var(--accbg);box-shadow:0 0 0 4px var(--glow);}
.dc.zero .n{opacity:.45;}
/* each service type and its progress */
.svcs{display:grid;gap:10px;}
.sv{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 11px;
  cursor:pointer;color:var(--ink);min-width:0;transition:border-color .2s,background .2s,box-shadow .2s;}
.sv:hover{border-color:var(--acc);}
.sv.on{border-color:var(--acc);background:var(--accbg);box-shadow:0 0 0 3px var(--glow);}
.sv .st{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;white-space:nowrap;}
.sv .st > b{overflow:hidden;text-overflow:ellipsis;}
.sv .ct{color:var(--ink2);font-size:12.5px;}
.sv .ct b{color:var(--ink);font-size:15px;}
.sv .sb{display:flex;height:5px;border-radius:999px;overflow:hidden;background:var(--line2);margin:5px 0 3px;}
.sv .sb i{display:block;height:100%;transition:width .7s cubic-bezier(.22,1,.36,1);}
.sv .ss{display:block;font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
@media (max-width:760px){ .svcs{grid-template-columns:1fr !important;gap:6px;} }
/* housekeeping's stages: one slim row of filters */
.pills{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.pl-list{display:flex;gap:6px;flex-wrap:wrap;}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--ink2);font-size:12.5px;font-weight:500;
  transition:border-color .2s,background .2s,color .2s;}
.pill i{width:8px;height:8px;border-radius:50%;display:inline-block;}
.pill b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;}
.pill:hover{border-color:var(--acc);}
.pill.on{border-color:var(--acc);background:var(--accbg);color:var(--ink);}
.pill.zero{opacity:.5;}
.done{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink2);white-space:nowrap;}
.done b{color:var(--ink);}
.mini{display:inline-block;width:120px;height:6px;border-radius:999px;background:var(--line2);overflow:hidden;}
.mini i{display:block;height:100%;background:#1a9e4b;border-radius:999px;transition:width .7s cubic-bezier(.22,1,.36,1);}
@media (max-width:760px){
  .desk{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
  .dc .n{font-size:24px;}
  .done{width:100%;}
  .mini{flex:1;}
}

/* table */
.wrap{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  overflow:auto;position:relative;}
.fill .wrap{flex:1 1 auto;min-height:320px;}
@media (min-width:1400px){ td[data-l="Housekeeper"],td[data-l="RQS"]{white-space:nowrap;} }
table{width:100%;border-collapse:separate;border-spacing:0;}
th{position:sticky;top:0;z-index:2;background:var(--head);text-align:left;font-size:12px;font-weight:600;color:var(--ink2);
  padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none;}
th.s{cursor:pointer;}
th.s:hover{color:var(--ink);}
th .ar{font-size:10px;margin-left:4px;color:var(--acc);}
td{padding:6px 10px;border-bottom:1px solid var(--line2);vertical-align:top;transition:background-color .35s ease;}
tr.row:hover td{background:var(--card2);}
tr.row.saving td{opacity:.55;background-image:linear-gradient(90deg,transparent,var(--glow),transparent);
  background-size:200% 100%;animation:shimmer 1.1s linear infinite;}
tr.row.flash td{animation:flash 2.6s ease-out both;}
tbody.enter tr.row{animation:rowIn .32s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--i,0) * 14ms);}
.rm{font-weight:700;font-size:15px;white-space:nowrap;}
.svc{display:inline-block;font-size:10.5px;font-weight:700;color:var(--chip-n-ink);background:var(--chip-n);border-radius:5px;
  padding:1px 5px;margin-left:6px;vertical-align:2px;}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12.5px;
  font-weight:600;white-space:nowrap;}
.chip .d{width:8px;height:8px;border-radius:50%;flex:none;}
.chip.live .d{animation:breathe 1.6s ease-in-out infinite;}
tr.row.flash .chip{animation:pop .5s cubic-bezier(.34,1.56,.64,1);}
.tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px;margin:3px 4px 0 0;white-space:nowrap;letter-spacing:.02em;}
.tag.early{background:var(--early);color:var(--early-ink);}
.tag.held{background:var(--chip-n);color:var(--chip-n-ink);}
.tag.late{background:var(--late);color:var(--late-ink);font-size:12px;padding:2px 8px;}
.tag.dep{background:var(--dep);color:var(--dep-ink);font-size:12px;padding:2px 8px;}
.tag.added{background:var(--added);color:var(--added-ink);}
.tag.pre{background:var(--pre);color:var(--pre-ink);}
.prc{font-size:12px;color:var(--pre-ink);background:var(--pre);border-radius:8px;padding:5px 8px;margin-top:4px;max-width:280px;}
.prc b{font-size:10px;letter-spacing:.04em;margin-right:4px;}
.prc .ok{font-weight:700;}
.prc .no{opacity:.7;}
.tile .sub{font-size:11px;color:var(--ink3);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tile.pre .n{color:var(--pre-ink);}
.src{font-size:11px;color:var(--ink3);margin-top:3px;white-space:nowrap;}
.t{white-space:nowrap;font-variant-numeric:tabular-nums;font-size:13px;}
.pl{display:inline-block;min-width:64px;color:var(--ink3);font-size:11.5px;}
.mut{color:var(--ink3);}
.unas{color:var(--ink3);font-style:italic;font-size:12.5px;}
.note{font-size:12.5px;color:var(--ink2);max-width:240px;}
.fdn{font-size:12.5px;color:var(--fd-ink);margin-top:3px;}
.fdn b{font-size:10px;background:var(--fd);color:var(--fd-ink);border-radius:4px;padding:0 5px;margin-right:5px;letter-spacing:.04em;}
.acts{min-width:214px;}
.ag{display:grid;grid-template-columns:auto auto auto;gap:4px;justify-content:end;}
.ag .a{margin:0;height:26px;padding:0 7px;white-space:nowrap;font-size:12px;}
.a{height:30px;padding:0 10px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);
  font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;display:block;width:100%;margin:0 0 5px;
  transition:transform .14s ease,border-color .2s,background-color .2s,color .2s;}
.a:hover{border-color:var(--acc);background:var(--accbg);}
.a:active{transform:scale(.97);}
.a.on{border-color:#e0930f;background:var(--late);color:var(--late-ink);}
.a.set{border-color:var(--acc);color:var(--acc);}
.a.go{background:var(--acc);border-color:var(--acc);color:#fff;width:auto;display:inline-block;margin:0;}
.a.go:hover{filter:brightness(1.08);}
.a.warn{color:#d14343;width:auto;display:inline-block;margin:0;}
.a.plain{width:auto;display:inline-block;margin:0;}
tr.ed td{background:var(--edit);border-bottom:1px solid var(--line);padding:0;}
.edin{padding:12px 14px;}
.edin.anim{animation:slide .26s cubic-bezier(.22,1,.36,1) both;}
.edbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.edbox select,.edbox input{height:36px;border:1.5px solid var(--line);border-radius:9px;padding:0 10px;
  background:var(--card);color:var(--ink);outline:none;}
.edbox select:focus,.edbox input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--glow);}
.edbox input{flex:1 1 280px;min-width:180px;}
.edbox .q{font-weight:600;}
.nl{margin-top:10px;display:flex;flex-direction:column;gap:6px;}
.nl div{display:flex;gap:10px;align-items:center;font-size:13px;}
.nl .by{color:var(--ink3);font-size:12px;}
.empty{padding:34px;text-align:center;color:var(--ink2);}
.hl{background:var(--hl);border-radius:3px;padding:0 1px;}

/* toast */
#toast{position:fixed;right:16px;bottom:16px;z-index:9;background:var(--toast);color:var(--toast-ink);
  border-radius:12px;padding:11px 16px;font-weight:600;font-size:13.5px;box-shadow:0 12px 30px rgba(0,0,0,.25);
  transform:translateY(20px);opacity:0;pointer-events:none;transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .25s ease;}
#toast.show{transform:translateY(0);opacity:1;}
#toast.bad{background:#b42318;color:#fff;}

/* A computer: every tile on one line. A laptop: tighter cells, so the table
   fits without scrolling sideways. */
@media (min-width:900px){ .tiles{grid-template-columns:repeat(11,minmax(0,1fr));} }
@media (max-width:1340px) and (min-width:761px){
  td{padding:8px 7px;font-size:13px;}
  th{padding:9px 7px;}
  .rm{font-size:14px;}
  .note{max-width:170px;}
  .pl{min-width:56px;}
  .acts{min-width:200px;}
  .a{font-size:12px;padding:0 8px;}
  .tile{padding:8px 10px;}
  .tile .n{font-size:21px;}
}
@keyframes ping{75%,100%{transform:scale(2.4);opacity:0;}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.35);opacity:.65;}}
@keyframes flash{0%{background-color:var(--glow);}100%{background-color:transparent;}}
@keyframes pop{0%{transform:scale(.85);}60%{transform:scale(1.08);}100%{transform:scale(1);}}
@keyframes rowIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
@keyframes slide{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
@keyframes shimmer{from{background-position:200% 0;}to{background-position:-200% 0;}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important;}
}
@media (max-width:760px){
  .hero{gap:8px;}
  .hero h1,.hero .sp{display:none;}
  .hero .day{font-size:13px;flex-basis:100%;}
  .live{font-size:11.5px;padding:4px 10px;}
  .tiles{grid-template-columns:repeat(3,1fr);}
  .tile{min-width:0;flex:1 1 30%;padding:8px 10px;}
  .tile .n{font-size:20px;}
  table,tbody,tr,td{display:block;width:100%;}
  thead{display:none;}
  tr.row{border-bottom:1px solid var(--line);padding:10px 6px;}
  td{border:0;padding:3px 8px;}
  td[data-l]:not(.k)::before{content:attr(data-l) ": ";color:var(--ink3);font-size:12px;}
  td.e{display:none;}
  .ag{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
  .ag .a{width:auto;padding:0 12px;}
  .wrap{overflow:visible;}
}
</style>
</head>
<body>
<div id="root">
  <div class="hero">
    <h1>Front Desk</h1>
    <span class="day" id="day"></span>
    <span class="live tr" id="live"><span class="dot"></span><span id="stamp">Live</span></span>
    <span class="sp"></span>
    <button class="theme tr" id="theme" title="Light / dark" aria-label="Switch between light and dark">
      <span class="knob"><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z"/></svg></span>
    </button>
  </div>
  <div class="bar">
    <div class="search" id="sbox">
      <svg class="mag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
      <input id="q" class="tr" type="search" autocomplete="off" spellcheck="false"
             placeholder="Search room, housekeeper, RQS or guest" aria-label="Search rooms">
      <span class="kbd">/</span>
      <button class="x" id="qx" title="Clear search" aria-label="Clear search">&#10005;</button>
    </div>
    <button class="btn tr" id="clear" title="Clear the search and the filter">Clear filter</button>
  </div>
  <div class="desk" id="desk"></div>
  <div class="svcs" id="svcs"></div>
  <div class="pills tr" id="pills"></div>
  <div class="wrap tr" id="wrap"><table><thead id="head"></thead><tbody id="body"></tbody></table>
    <div class="empty" id="empty" style="display:none"></div></div>
</div>
<div id="toast"></div>
<script>
(function () {
  "use strict";
  var root = document.getElementById("root");
  var qEl = document.getElementById("q"), sbox = document.getElementById("sbox");
  var args = {rows: []}, pending = null, firstData = true;
  var state = {q: "", tile: "all", svc: "", sort: "room", dir: 1, open: null, saving: {}};
  var prevStatus = {}, flashAt = {}, lastCounts = {}, lastAct = null, enterNext = false;
  var REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ── theme ────────────────────────────────────────────────────────────────
  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function recall(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  var theme = recall("fd-theme") ||
    (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  function applyTheme() {
    document.documentElement.setAttribute("data-theme", theme);
    try { window.parent.document.documentElement.setAttribute("data-fd-theme", theme); } catch (e) {}
  }
  applyTheme();
  document.getElementById("theme").addEventListener("click", function () {
    theme = theme === "dark" ? "light" : "dark";
    store("fd-theme", theme);
    applyTheme();
    draw();
  });
  try {
    var saved = JSON.parse(recall("fd-board") || "{}");
    if (saved.sort) { state.sort = saved.sort; state.dir = saved.dir || 1; }
  } catch (e) {}

  // ── Streamlit ────────────────────────────────────────────────────────────
  function send(type, extra) {
    var msg = {isStreamlitMessage: true, type: type};
    for (var k in extra) { msg[k] = extra[k]; }
    window.parent.postMessage(msg, "*");
  }
  var lastH = -1;
  function fit() {
    // A computer: the board fills the window below where it starts, and its
    // table scrolls under the search and tiles. A phone: the page scrolls.
    var h, fe = null;
    try { fe = window.frameElement; } catch (e) { fe = null; }
    var wide = window.innerWidth > 760;
    if (wide && fe) {
      var top = fe.getBoundingClientRect().top + (window.parent.scrollY || 0);
      // The room list gets at least ~two-thirds of the window (Hari, 25 Nov:
      // "make the table longer, more records visible"); with the cards above
      // that can be taller than the window, and then the page scrolls.
      var wrapEl = document.getElementById("wrap");
      var above = wrapEl ? Math.max(0, wrapEl.getBoundingClientRect().top - root.getBoundingClientRect().top) : 0;
      var listMin = Math.round(window.parent.innerHeight * 0.66);
      h = Math.max(560, Math.round(window.parent.innerHeight - top - 18), above + listMin + 20);
      root.classList.add("fill");
      root.style.height = (h - 6) + "px";
    } else {
      root.classList.remove("fill");
      root.style.height = "";
      h = Math.ceil(root.getBoundingClientRect().height) + 10;
    }
    if (h !== lastH) { lastH = h; send("streamlit:setFrameHeight", {height: h}); }
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c];
    });
  }
  function toast(text, bad) {
    var t = document.getElementById("toast");
    t.textContent = text;
    t.className = bad ? "show bad" : "show";
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.className = bad ? "bad" : ""; }, 2600);
  }
  function act(action, room, value) {
    state.saving[room] = true;
    state.open = null;
    var id = Date.now() + "-" + Math.random().toString(36).slice(2, 7);
    lastAct = {id: id, action: action, room: room, value: value === undefined ? null : value};
    send("streamlit:setComponentValue", {value: {id: id, action: action, room: room, value: lastAct.value},
      dataType: "json"});
    draw();
  }

  // ── what is shown ────────────────────────────────────────────────────────
  var READY = {cleaning_done: 1, occupied_cleaned: 1, to_be_inspected: 1};
  function bucket(r) {
    if (r.status === "inspected" || r.status === "already_clean") { return "inspected"; }
    if (READY[r.status]) { return "toinspect"; }
    if (r.status === "cleaning_started") { return "cleaning"; }
    if (r.status === "pending") { return "awaiting"; }
    return "other";
  }
  // What the desk works to, big: each card counts what is still to come and
  // filters the list to it (Hari, 25 Nov: the strip had eleven tiles and a
  // progress card -- too much). [key, label, colour, on the list?, still to
  // go? (null: a plain count), tooltip]
  function ready(r) { return bucket(r) === "inspected"; }
  var DESK = [
    ["arriving", "Arrivals to go", "#2f6fd6", function (r) { return !!r.arriving; },
     function (r) { return !!r.arriving && !ready(r); }, "A guest arrives today: rooms not inspected yet"],
    ["prereg", "Pre-reg to go", "#7c3aed", function (r) { return !!r.prereg; },
     function (r) { return !!r.prereg && !ready(r); }, "On the desk&#39;s Pre-Reg list: rooms not inspected yet"],
    ["late", "Late out", "#e0730f", function (r) { return !r.departed && !!(r.late_out || r.late_report); },
     null, "Late checkout, from the Arrival Report or the desk, not departed yet"],
    ["departed", "Departed", "#16a34a", function (r) { return !!r.departed; },
     null, "Marked departed by the desk"]
  ];
  // Housekeeping's stages, small: a filter, not a headline.
  var PILLS = [
    ["all", "All", null, function () { return true; }, "Every room on today&#39;s charts"],
    ["awaiting", "Awaiting", "#94a3b8", function (r) { return bucket(r) === "awaiting"; }, "Awaiting service"],
    ["cleaning", "Cleaning", "#e89611", function (r) { return bucket(r) === "cleaning"; }, "Cleaning started"],
    ["toinspect", "To inspect", "#2f80ed", function (r) { return bucket(r) === "toinspect"; }, "Cleaned, waiting for the RQS"],
    ["inspected", "Inspected", "#1a9e4b", function (r) { return bucket(r) === "inspected"; }, "Inspected: ready"],
    ["other", "DND / later", "#a855f7", function (r) { return bucket(r) === "other"; }, "Do not disturb, return later, service refused, help"],
    ["added", "Added", "#0e7490", function (r) { return !!r.added; }, "Added to the day&#39;s sheet after the morning build"]
  ];
  var TEST = {};
  DESK.forEach(function (t) { TEST[t[0]] = t[3]; });
  PILLS.forEach(function (t) { TEST[t[0]] = t[3]; });
  var ORDER = {awaiting: 0, cleaning: 1, toinspect: 2, inspected: 3, other: 4};
  var COLS = [
    ["room", "Room", "room"], ["status", "Status", "status"], ["hk", "Housekeeper", "hk"], ["rqs", "RQS", "rqs"],
    ["prog", "Progress", null], ["out", "Guest out", null], ["cur", "Current guest", "guest"],
    ["arr", "Arriving", "arriving"], ["notes", "Notes", null], ["acts", "", null]
  ];

  function terms() { return state.q.toLowerCase().split(/\s+/).filter(Boolean); }
  function matches(r, ts) {
    if (!ts.length) { return true; }
    var hay = [r.room, r.hk, r.rqs, r.guest, r.arriving, r.prereg ? "pre-reg prereg " + r.prereg.unit : ""].join(" ").toLowerCase();
    for (var i = 0; i < ts.length; i++) { if (hay.indexOf(ts[i]) < 0) { return false; } }
    return true;
  }
  function mark(text, ts) {
    var s = esc(text);
    if (!ts.length || !text) { return s; }
    ts.forEach(function (t) {
      var re = new RegExp("(" + esc(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
      s = s.replace(re, '<span class="hl">$1</span>');
    });
    return s;
  }
  function sortKey(r) {
    var c = state.sort;
    if (c === "status") { return ORDER[bucket(r)] + "|" + r.room; }
    if (c === "hk" || c === "rqs" || c === "arriving" || c === "guest") {
      return (r[c] ? "0" + String(r[c]).toLowerCase() : "1") + "|" + r.room;
    }
    return r.room;
  }
  function hexRgb(h) {
    h = String(h || "#94a3b8").replace("#", "");
    if (h.length === 3) { h = h.split("").map(function (c) { return c + c; }).join(""); }
    var n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function chipStyle(r) {
    if (theme === "dark") {
      var c = hexRgb(r.dot), t = c.map(function (v) { return Math.round(v + (255 - v) * 0.45); });
      return "background:rgba(" + c.join(",") + ",.18);color:rgb(" + t.join(",") + ")";
    }
    return "background:" + r.bg + ";color:" + r.ink;
  }

  function countUp(el, from, to) {
    if (REDUCED || from === to || from === undefined) { el.textContent = to; return; }
    var t0 = performance.now(), d = 520;
    function step(t) {
      var p = Math.min(1, (t - t0) / d), e = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(from + (to - from) * e);
      if (p < 1) { requestAnimationFrame(step); }
    }
    requestAnimationFrame(step);
  }

  function drawDesk(rows) {
    var box = document.getElementById("desk"), pi = args.prereg || {};
    if (box.children.length !== DESK.length) {
      box.innerHTML = DESK.map(function (t) {
        return '<button class="dc tr" data-tile="' + t[0] + '" title="' + t[5] + '" style="--c:' + t[2] + '">' +
          '<span class="dl">' + esc(t[1]) + '</span><span class="n">0</span>' +
          '<span class="bar"><i></i></span><span class="sub"></span></button>';
      }).join("");
    }
    DESK.forEach(function (t, i) {
      var el = box.children[i], on = rows.filter(t[3]), all = on.length;
      var n = t[4] ? on.filter(t[4]).length : all, done = all - n;
      el.classList.toggle("on", state.tile === t[0]);
      el.classList.toggle("zero", all === 0);
      el.classList.toggle("count", !t[4]);
      countUp(el.querySelector(".n"), lastCounts[t[0]], n);
      lastCounts[t[0]] = n;
      el.querySelector(".bar i").style.width = (t[4] && all ? 100 * done / all : 0) + "%";
      var sub = t[4] ? (all ? done + " of " + all + " ready" : "none today") :
        t[0] === "late" ? (all === 1 ? "guest still in" : "guests still in") : "marked by the desk";
      if (t[0] === "prereg") {
        sub = pi.carried ? "yesterday's list still up" : pi.error && !all ? "couldn't read the list" :
          !all ? (pi.at ? "none on the list" : "list not read yet") : sub + (pi.at ? " \u00b7 " + pi.at : "");
      }
      el.querySelector(".sub").textContent = sub;
    });
  }

  // Each service type and how far it has got (Hari, 25 Nov). A click keeps
  // the list to that service; the stage filters below then count it alone.
  var SVC_ORDER = {FC: 0, IH: 1, DS: 2, "D&V": 3};
  var STAGES = [["inspected", "inspected", "#1a9e4b"], ["toinspect", "cleaned", "#2f80ed"],
                ["cleaning", "cleaning", "#e89611"], ["awaiting", "not started", "#94a3b8"],
                ["other", "DND / refused / later", "#a855f7"]];
  function drawSvcs(rows) {
    var box = document.getElementById("svcs"), by = {};
    rows.forEach(function (r) {
      var k = r.svc || "?";
      if (!by[k]) { by[k] = {name: r.service || k, n: 0, c: {}}; }
      by[k].n += 1;
      var b = bucket(r);
      by[k].c[b] = (by[k].c[b] || 0) + 1;
    });
    var keys = Object.keys(by).sort(function (a, b) {
      var oa = a in SVC_ORDER ? SVC_ORDER[a] : 9, ob = b in SVC_ORDER ? SVC_ORDER[b] : 9;
      return oa - ob || by[b].n - by[a].n;
    });
    if (state.svc && !by[state.svc]) { state.svc = ""; }
    box.style.gridTemplateColumns = "repeat(" + Math.max(keys.length, 1) + ",minmax(0,1fr))";
    box.innerHTML = keys.map(function (k) {
      var v = by[k], ins = v.c.inspected || 0;
      var segs = STAGES.map(function (st) {
        var n = v.c[st[0]] || 0;
        return n ? '<i style="width:' + (100 * n / v.n) + '%;background:' + st[2] + '"></i>' : "";
      }).join("");
      var tip = STAGES.map(function (st) { return (v.c[st[0]] || 0) + " " + st[1]; }).join(" \u00b7 ");
      var left = (v.c.awaiting || 0) + (v.c.cleaning || 0);
      return '<button class="sv tr' + (state.svc === k ? " on" : "") + '" data-svc="' + esc(k) + '" title="' + esc(tip) + '">' +
        '<span class="st"><b>' + esc(v.name) + '</b><span class="ct"><b>' + ins + '</b> / ' + v.n + ' ready</span></span>' +
        '<span class="sb">' + segs + '</span>' +
        '<span class="ss">' + (v.c.toinspect || 0) + ' cleaned \u00b7 ' + left + ' to go' +
        ((v.c.other || 0) ? ' \u00b7 ' + v.c.other + ' DND/refused' : '') + '</span></button>';
    }).join("");
  }

  function drawPills(rows) {
    var box = document.getElementById("pills");
    if (!box.firstChild) {
      box.innerHTML = '<div class="pl-list">' + PILLS.map(function (t) {
        return '<button class="pill tr" data-tile="' + t[0] + '" title="' + t[4] + '">' +
          (t[2] ? '<i style="background:' + t[2] + '"></i>' : "") + esc(t[1]) + ' <b>0</b></button>';
      }).join("") + '</div><div class="done"><span id="donet"></span><span class="mini"><i id="donei"></i></span></div>';
    }
    var list = box.firstChild;
    PILLS.forEach(function (t, i) {
      var el = list.children[i], n = rows.filter(t[3]).length;
      el.classList.toggle("on", state.tile === t[0]);
      el.classList.toggle("zero", n === 0 && t[0] !== "all");
      el.querySelector("b").textContent = n;
    });
    var ins = rows.filter(ready).length, tot = rows.length || 1;
    document.getElementById("donet").innerHTML = "<b>" + ins + "</b> of " + rows.length + " inspected";
    document.getElementById("donei").style.width = (100 * ins / tot) + "%";
  }

  function editor(r) {
    var o = state.open, h = '<tr class="ed"><td colspan="' + COLS.length + '"><div class="edin' +
      (state.openFresh ? " anim" : "") + '"><div class="edbox">';
    if (o.kind === "late") {
      var cur = r.late_out_value || r.late_report_value || "11:00";
      h += '<span class="q">Late checkout for ' + esc(r.room) + ' &mdash; guest leaves at</span><select id="lt">' +
        (args.times || []).map(function (t) {
          return '<option value="' + t[0] + '"' + (t[0] === cur ? " selected" : "") + '>' + esc(t[1]) + '</option>';
        }).join("") + '</select>' +
        '<button class="a go" data-do="late-save">Save</button>' +
        (r.late_out ? '<button class="a warn" data-do="late-clear">Remove</button>' : "") +
        '<button class="a plain" data-do="close">Cancel</button>' +
        (r.late_report && !r.late_out ? '<span class="src">Arrival Report says ' + esc(r.late_report) + '</span>' : "");
    } else if (o.kind === "dep") {
      if (r.departed) {
        h += '<span class="q">' + esc(r.room) + ' was marked departed at ' + esc(r.departed) +
          (r.departed_by ? " by " + esc(r.departed_by) : "") + '. Undo?</span>' +
          '<button class="a warn" data-do="dep-undo">Undo departed</button><button class="a plain" data-do="close">Cancel</button>';
      } else {
        h += '<span class="q">Has the guest in ' + esc(r.room) + ' left?</span>' +
          '<button class="a go" data-do="dep-yes">Yes, guest departed</button><button class="a plain" data-do="close">Cancel</button>';
      }
    } else {
      h += '<span class="q">Note to housekeeping, ' + esc(r.room) + '</span>' +
        '<input id="nt" maxlength="240" placeholder="e.g. guest left a jacket in the closet">' +
        '<button class="a go" data-do="note-save">Save note</button><button class="a plain" data-do="close">Cancel</button>';
      h += '</div>';
      if (r.fd_notes && r.fd_notes.length) {
        h += '<div class="nl">' + r.fd_notes.map(function (n) {
          return '<div><span>' + esc(n.text) + '</span><span class="by">' + esc(n.by) + (n.at ? " &middot; " + esc(n.at) : "") +
            '</span><button class="a warn" data-do="note-rm" data-id="' + esc(n.id) + '">Remove</button></div>';
        }).join("") + '</div>';
      }
      return h + '</div></td></tr>';
    }
    return h + '</div></div></td></tr>';
  }

  // The Pre-Reg tab's own columns for a room (prereg.card).
  function preCard(p) {
    if (!p) { return ""; }
    function yn(on, yes, no) { return on ? '<span class="ok">' + yes + ' &#10003;</span>' : '<span class="no">' + no + '</span>'; }
    var bits = [];
    if (p.checkin) { bits.push("Check-in: " + esc(p.checkin)); }
    bits.push(yn(p.keys, "Keys made", "Keys not made"));
    if (p.mobile) { bits.push(yn(true, "Mobile keys", "")); }
    if (p.rushed) { bits.push('<span class="ok">Rush</span>'); }
    bits.push(yn(p.zingle_added, "Pre-reg Zingled", "Not Zingled"));
    bits.push(yn(p.ready_zingled, "Ready Zingled", "Ready not Zingled"));
    return '<div class="prc"><b>PRE-REG ' + esc(p.unit) + '</b>' + bits.join(" &middot; ") +
      (p.notes ? '<div>' + esc(p.notes) + '</div>' : "") + '</div>';
  }

  function cell(c, r, ts) {
    var l = ' data-l="' + c[1] + '"';
    switch (c[0]) {
      case "room":
        return '<td class="k"><span class="rm">' + mark(r.room, ts) + '</span><span class="svc" title="' + esc(r.service) + '">' +
          esc(r.svc) + '</span><br>' + (r.early ? '<span class="tag early">EARLY IN</span>' : "") +
          (r.held ? '<span class="tag held" title="Stayover, model or no guest yet: held off the charts">HELD</span>' : "") +
          (r.added ? '<span class="tag added" title="Typed onto the day&#39;s GC8 Inspections tab after the morning build">ADDED</span>' : "") +
          (r.prereg ? '<span class="tag pre" title="On the desk&#39;s Pre-Reg list as ' + esc(r.prereg.unit) + '">PRE-REG</span>' : "") + '</td>';
      case "status":
        return '<td' + l + '><span class="chip' + (r.status === "cleaning_started" ? " live" : "") + '" style="' + chipStyle(r) +
          '"><span class="d" style="background:' + esc(r.dot) + '"></span>' + esc(r.label) + '</span></td>';
      case "hk":
        return '<td' + l + '>' + (r.hk ? mark(r.hk, ts) :
          r.unassigned ? '<span class="unas">On the sheet, not assigned yet</span>' :
          r.off_charts ? '<span class="unas">Not on today&#39;s charts</span>' : '<span class="mut">&mdash;</span>') + '</td>';
      case "rqs": return '<td' + l + '>' + (r.rqs ? mark(r.rqs, ts) : '<span class="mut">&mdash;</span>') + '</td>';
      case "prog":
        var p = [["Started", r.started], ["Cleaned", r.cleaned], ["Inspected", r.inspected]]
          .filter(function (x) { return x[1]; })
          .map(function (x) { return '<div class="t"><span class="pl">' + x[0] + '</span>' + esc(x[1]) + '</div>'; }).join("");
        return '<td' + (p ? l : ' class="e"') + '>' + (p || '<span class="mut">&mdash;</span>') + '</td>';
      case "out":
        // The Arrival Report's late checkouts come in by themselves; the desk's
        // own (added or changed later) win, and say what the report had.
        var o = r.departed ? '<span class="tag dep">Departed ' + esc(r.departed) + '</span>' +
            (r.departed_by ? '<div class="src">' + esc(r.departed_by) + '</div>' : "") :
          r.late_out ? '<span class="tag late">Late out ' + esc(r.late_out) + '</span><div class="src">Front desk' +
            (r.late_report ? " &middot; report said " + esc(r.late_report) : "") + '</div>' :
          r.late_report ? '<span class="tag late">Late out ' + esc(r.late_report) + '</span><div class="src">Arrival Report</div>' : "";
        return '<td' + (o ? l : ' class="e"') + '>' + (o || '<span class="mut">&mdash;</span>') + '</td>';
      case "cur":
        return '<td' + (r.guest ? l : ' class="e"') + '>' + (r.guest ? mark(r.guest, ts) : '<span class="mut">&mdash;</span>') + '</td>';
      case "arr":
        return '<td' + (r.arriving ? l : ' class="e"') + '>' + (r.arriving ? mark(r.arriving, ts) : '<span class="mut">&mdash;</span>') + '</td>';
      case "notes":
        var n = preCard(r.prereg) + (r.notes || []).map(function (x) { return '<div class="note">' + esc(x) + '</div>'; }).join("") +
          (r.fd_notes || []).map(function (x) { return '<div class="fdn"><b>FD</b>' + esc(x.text) + '</div>'; }).join("");
        return '<td' + (n ? l : ' class="e"') + '>' + (n || '<span class="mut">&mdash;</span>') + '</td>';
      case "acts":
        if (!args.can_edit) { return '<td class="e"></td>'; }
        var on = function (k) { return state.open && state.open.room === r.room && state.open.kind === k ? " on" : ""; };
        return '<td class="acts k"><div class="ag">' +
          '<button class="a' + on("late") + (r.late_out ? " set" : "") + '" data-open="late" data-room="' + r.room + '">' +
            "Late out" + '</button>' +
          '<button class="a' + on("dep") + (r.departed ? " set" : "") + '" data-open="dep" data-room="' + r.room + '">' +
            (r.departed ? "Departed &#10003;" : "Departed") + '</button>' +
          '<button class="a' + on("note") + (r.fd_notes && r.fd_notes.length ? " set" : "") + '" data-open="note" data-room="' + r.room + '">Note' +
            (r.fd_notes && r.fd_notes.length ? " (" + r.fd_notes.length + ")" : "") + '</button></div></td>';
    }
    return "<td></td>";
  }

  function draw() {
    var rows = args.rows || [], ts = terms(), now = Date.now();
    sbox.classList.toggle("has", !!state.q);
    var inSearch = rows.filter(function (r) { return matches(r, ts); });
    drawDesk(inSearch);
    drawSvcs(inSearch);
    var inSvc = state.svc ? inSearch.filter(function (r) { return (r.svc || "?") === state.svc; }) : inSearch;
    drawPills(inSvc);
    var test = TEST[state.tile] || TEST.all;
    var shown = inSvc.filter(function (r) { return test(r); });
    // The Pre-Reg list: rooms still to be ready first, then the ready ones.
    var preFirst = state.tile === "prereg";
    shown.sort(function (a, b) {
      if (preFirst) {
        var ra = bucket(a) === "inspected" ? 1 : 0, rb = bucket(b) === "inspected" ? 1 : 0;
        if (ra !== rb) { return ra - rb; }
      }
      var x = sortKey(a), y = sortKey(b);
      return (x < y ? -1 : x > y ? 1 : 0) * state.dir;
    });
    document.getElementById("head").innerHTML = "<tr>" + COLS.map(function (c) {
      var arr = c[2] && state.sort === c[2] ? '<span class="ar">' + (state.dir > 0 ? "&#9650;" : "&#9660;") + '</span>' : "";
      return '<th' + (c[2] ? ' class="s" data-sort="' + c[2] + '"' : "") + '>' + esc(c[1]) + arr + '</th>';
    }).join("") + "</tr>";
    var html = "";
    shown.forEach(function (r, i) {
      var since = now - (flashAt[r.room] || 0), fl = since < 2600;
      html += '<tr class="row' + (state.saving[r.room] ? " saving" : "") + (fl ? " flash" : "") + '" style="--i:' + Math.min(i, 24) +
        (fl ? ';animation-delay:-' + since + 'ms' : "") + '">' + COLS.map(function (c) { return cell(c, r, ts); }).join("") + "</tr>";
      if (state.open && state.open.room === r.room) { html += editor(r); }
    });
    var body = document.getElementById("body");
    var keep = {nt: valueOf("nt"), lt: valueOf("lt")};
    body.className = enterNext && !REDUCED ? "enter" : "";
    enterNext = false;
    body.innerHTML = html;
    if (keep.nt !== null && document.getElementById("nt")) { document.getElementById("nt").value = keep.nt; }
    if (keep.lt !== null && document.getElementById("lt")) { document.getElementById("lt").value = keep.lt; }
    state.openFresh = false;
    var empty = document.getElementById("empty");
    empty.style.display = shown.length ? "none" : "block";
    empty.textContent = rows.length ? "No rooms match. Clear the filter to see them all." : "No schedule for today yet.";
    document.getElementById("day").textContent = args.day || "";
    document.getElementById("stamp").textContent = args.stamp || "Live";
    document.getElementById("live").classList.toggle("stale", !!args.stale);
    if (state.open) {
      var f = document.getElementById("nt") || document.getElementById("lt");
      if (f && !f._focused) { f._focused = true; f.focus(); }
    }
    fit();
  }

  function valueOf(id) { var el = document.getElementById(id); return el ? el.value : null; }
  function find(room) {
    var rows = args.rows || [];
    for (var i = 0; i < rows.length; i++) { if (rows[i].room === room) { return rows[i]; } }
    return null;
  }

  // ── what people do ───────────────────────────────────────────────────────
  qEl.addEventListener("input", function () { state.q = qEl.value; draw(); });
  qEl.addEventListener("keydown", function (ev) { if (ev.key === "Escape") { qEl.value = ""; state.q = ""; draw(); } });
  document.getElementById("qx").addEventListener("click", function () { qEl.value = ""; state.q = ""; draw(); qEl.focus(); });
  document.getElementById("clear").addEventListener("click", function () {
    qEl.value = ""; state.q = ""; state.tile = "all"; state.svc = ""; state.open = null; applyPending(); enterNext = true; draw();
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "/" && document.activeElement !== qEl && !(ev.target && /INPUT|SELECT|TEXTAREA/.test(ev.target.tagName))) {
      ev.preventDefault(); qEl.focus();
    }
  });

  root.addEventListener("click", function (ev) {
    var t = ev.target.closest ? ev.target.closest("[data-tile],[data-svc],[data-sort],[data-open],[data-do]") : null;
    if (!t) { return; }
    if (t.hasAttribute("data-svc")) {
      var v = t.getAttribute("data-svc");
      state.svc = state.svc === v ? "" : v;
      enterNext = true; draw(); return;
    }
    if (t.hasAttribute("data-tile")) {
      var k = t.getAttribute("data-tile");
      state.tile = (state.tile === k && k !== "all") ? "all" : k;
      enterNext = true; draw(); return;
    }
    if (t.hasAttribute("data-sort")) {
      var s = t.getAttribute("data-sort");
      state.dir = state.sort === s ? -state.dir : 1;
      state.sort = s;
      store("fd-board", JSON.stringify({sort: state.sort, dir: state.dir}));
      enterNext = true; draw(); return;
    }
    if (t.hasAttribute("data-open")) {
      var room = t.getAttribute("data-room"), kind = t.getAttribute("data-open");
      state.open = (state.open && state.open.room === room && state.open.kind === kind) ? null : {room: room, kind: kind};
      state.openFresh = !!state.open;
      if (!state.open) { applyPending(); }
      draw(); return;
    }
    var d = t.getAttribute("data-do"), r = state.open && find(state.open.room);
    if (d === "close" || !r) { state.open = null; applyPending(); draw(); return; }
    if (d === "late-save") { act("late", r.room, document.getElementById("lt").value); }
    else if (d === "late-clear") { act("late", r.room, null); }
    else if (d === "dep-yes") { act("departed", r.room, true); }
    else if (d === "dep-undo") { act("departed", r.room, false); }
    else if (d === "note-save") {
      var v = (document.getElementById("nt").value || "").trim();
      if (!v) { document.getElementById("nt").focus(); return; }
      act("note", r.room, v);
    } else if (d === "note-rm") { act("note_remove", r.room, t.getAttribute("data-id")); }
  });
  root.addEventListener("keydown", function (ev) {
    if (ev.target && ev.target.id === "nt" && ev.key === "Enter") {
      ev.preventDefault();
      var b = root.querySelector('[data-do="note-save"]'); if (b) { b.click(); }
    }
    if (ev.key === "Escape" && state.open) { state.open = null; applyPending(); draw(); }
  });

  // Did the last thing the desk did take? Read off the board that came back.
  function confirmAct(err) {
    var a = lastAct, r = find(a.room), ok = false, what = "";
    lastAct = null;
    delete state.saving[a.room];
    if (err || !r) { toast(a.room + ": not saved, try again", true); draw(); return; }
    if (a.action === "late") {
      ok = (r.late_out_value || null) === (a.value || null);
      what = a.value ? "late checkout " + r.late_out : "late checkout removed";
    } else if (a.action === "departed") {
      ok = !!r.departed === !!a.value; what = a.value ? "guest departed" : "departed undone";
    } else if (a.action === "note") {
      ok = (r.fd_notes || []).some(function (n) { return n.text === a.value; }); what = "note saved";
    } else if (a.action === "note_remove") {
      ok = !(r.fd_notes || []).some(function (n) { return n.id === a.value; }); what = "note removed";
    }
    toast(ok ? "✓ " + a.room + ": " + what : a.room + ": not saved, try again", !ok);
    if (ok) { flashAt[a.room] = Date.now(); }
    draw();
  }

  function applyPending() { if (pending) { take(pending); pending = null; } }
  function take(a) {
    // Rooms whose status moved since the last board glow for a moment.
    var now = Date.now();
    (a.rows || []).forEach(function (r) {
      if (!firstData && prevStatus[r.room] !== undefined && prevStatus[r.room] !== r.status) { flashAt[r.room] = now; }
      prevStatus[r.room] = r.status;
    });
    firstData = false;
    args = a;
  }
  window.addEventListener("message", function (ev) {
    var d = ev.data || {};
    if (d.type !== "streamlit:render") { return; }
    var a = d.args || {};
    // The page answers each save with its id (ack): only then is it done.
    var answered = lastAct && a.ack === lastAct.id;
    if (state.open && !answered) { pending = a; return; }
    take(a); pending = null;
    if (answered) { confirmAct(a.ack_err); } else { draw(); }
  });
  if (window.ResizeObserver) { new ResizeObserver(function () { if (!root.classList.contains("fill")) { fit(); } }).observe(root); }
  window.addEventListener("resize", fit);
  try { window.parent.addEventListener("resize", fit); } catch (e) {}
  send("streamlit:componentReady", {apiVersion: 1});
})();
</script>
</body>
</html>
